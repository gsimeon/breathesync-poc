name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Typecheck, Test & Package
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests (Typecheck & Unit Tests)
        run: npm test

      - name: Build Bundles
        run: npm run build

      - name: Build Windows NSIS Installer
        run: npm run package:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Installer Artifact
        shell: powershell
        run: |
          if (-not (Test-Path "release/BreatheSync Setup 0.1.0.exe")) {
            throw "Expected NSIS installer executable not found in release/"
          }
          $item = Get-Item "release/BreatheSync Setup 0.1.0.exe"
          Write-Output "Verified installer: $($item.Name) ($([math]::Round($item.Length / 1MB, 2)) MB)"
